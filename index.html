<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ちるクリエイト | 公式サイト</title>
  
  <link rel="icon" href="logo/favicon.png" type="image/png">

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'M PLUS Rounded 1c', sans-serif; scroll-behavior: smooth; }
    .animate-blob { animation: blob 7s infinite; }
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animation-delay-2000 { animation-delay: 2s; }
    .hover-pop { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .hover-pop:hover { transform: translateY(-20px) scale(1.05); }
    .hover-tilt { transition: transform 0.3s ease-in-out; }
    .hover-tilt:hover { transform: rotate(10deg) scale(1.1); }
    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-fade { animation: slideFadeIn 0.5s ease-out forwards; }
    .text-pretty { text-wrap: pretty; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #fda4af; border-radius: 10px; }
    .animate-ping-slow { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    @keyframes ping {
      75%, 100% { transform: scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body class="bg-[#fff1f2]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ name, className = "w-6 h-6" }) => {
      const icons = {
        twitter: <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-9.56-6.638 9.56H.553l8.604-9.833L0 1.154h7.594l5.243 6.932 6.064-6.932zm-1.294 19.497h2.039L6.486 3.24H4.298l13.309 17.41z" fill="currentColor" />,
        instagram: <g><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></g>,
        youtube: <g><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></g>,
        'shopping-bag': <g><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></g>,
        'external-link': <g><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></g>,
        'chevron-right': <polyline points="9 18 15 12 9 6" />,
        'mail': <g><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></g>,
        'close': <g><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></g>,
        'copy': <g><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></g>,
        'volume': <g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></g>,
        'play': <polygon points="5 3 19 12 5 21 5 3"/>
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    };

    const characters = [
      { id: 'chill', name: '海老瀬ちる', furigana: 'えびせちる', illustrator: 'ペペロンロン', color: '#ff7e79', colorName: '桜えびピンク', motif: '桜エビ・漁港', from: '由比', area: '静岡エリア', catch: '静岡を第2の秋葉原にするぞ～！', mainImg: 'main/chill.png', cardImg: 'card/chill.png', nuiImg: 'nui/chill.PNG', voiceSrc: 'voice/chill.wav' },
      { id: 'kohaku', name: '白金琥珀', furigana: 'ぷらちなこはく', illustrator: 'くるぽ', color: '#fbbf24', colorName: 'イエローホワイト', motif: '観光・グルメ', from: '熱海', area: '熱海エリア', catch: 'ごきげんよう♪白金琥珀ですわ！', mainImg: 'main/kohaku.png', cardImg: 'card/kohaku.png', nuiImg: 'nui/kohaku.PNG', voiceSrc: 'voice/kohaku.wav' },
      { id: 'chacha', name: '茶々', furigana: 'ちゃちゃ', illustrator: 'yazawa', color: '#4ade80', colorName: '緑茶グリーン', motif: '静岡茶・自然', from: '掛川', area: '掛川エリア', catch: '朝ごはんにラーメンは普通だら？', mainImg: 'main/chacha.png', cardImg: 'card/chacha.png', nuiImg: 'nui/chacha.PNG', voiceSrc: 'voice/chacha.wav' },
      { id: 'type10', name: 'Type-10', furigana: 'たいぷてん', illustrator: '伊澄', color: '#3b82f6', colorName: '富士山ブルー', motif: '富士山・電子機器', from: '富士', area: '新富士エリア', catch: '今日もお疲れ様でした。温かいお茶をご用意しますね( ^^) _旦~~', mainImg: 'main/10.png', cardImg: 'card/10.png', nuiImg: 'nui/10.PNG', voiceSrc: 'voice/10.wav' },
      { id: 'coco', name: '錨ココ', furigana: 'いかりここ', illustrator: 'AME', color: '#f97316', colorName: '甘夏オレンジ', motif: '商業・祭り', from: '浜松', area: '浜松エリア', catch: 'これはこれはお目が高いにゃあ～旦那さん！', mainImg: 'main/coco.png', cardImg: 'card/COCO.png', nuiImg: 'nui/coco.PNG', voiceSrc: 'voice/coco.wav' },
      { id: 'hachi', name: '錨ハチ', furigana: 'いかりはち', illustrator: 'イブキ', color: '#d946ef', colorName: 'ピンクパープル', motif: 'アウトドア・バイク', from: '三島', area: '三島エリア', catch: '外で食べるコロッケが一番美味しいんだから！', mainImg: 'main/hachi.png', cardImg: 'card/HACHI.png', nuiImg: 'nui/hachi.PNG', voiceSrc: 'voice/hachi.wav' }
    ];

    const newsList = [
      { date: '2026.05.10', category: 'INFO', title: 'フォローお待ちしております！', link: 'https://x.com/chillcreate_v' },
      { date: '2026.05.10', category: 'INFO', title: 'ちるクリエイト公式ウェブサイトを公開しました🎉', link: '#' },
      { date: '2026.05.3', category: 'INFO', title: 'ちるクリエイト始動しました🦐', link: '#about' }
    ];

    const SmartImage = ({ src, alt, className = "", style = {}, objectMode = "object-contain" }) => {
      const [error, setError] = useState(false);
      return !src || error ? (
        <div className={`bg-slate-50 border-none flex flex-col items-center justify-center text-slate-400 text-[10px] ${className}`}>
           <span className="font-bold text-center">{alt}<br/>(画像待ち)</span>
        </div>
      ) : <img src={src} alt={alt} style={style} className={`${objectMode} ${className}`} onError={() => setError(true)} />;
    };

    const SectionTitle = ({ en, ja }) => (
      <div className="text-center mb-12">
        <h2 className="text-4xl md:text-6xl font-black text-rose-400 tracking-wider uppercase">{en}</h2>
        <p className="text-sm md:text-base font-bold text-rose-500 mt-2">{ja}</p>
        <div className="w-16 h-1 bg-rose-400 mx-auto mt-4 rounded-full"></div>
      </div>
    );

    function App() {
      const [selectedChar, setSelectedChar] = useState(null);
      const [showTopBtn, setShowTopBtn] = useState(false);
      const [isPlaying, setIsPlaying] = useState(false);
      const audioRef = useRef(null);
      
      useEffect(() => {
        const handleScroll = () => setShowTopBtn(window.scrollY > 300);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollTo = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      const playVoice = (src) => {
        if (audioRef.current) audioRef.current.pause();
        const audio = new Audio(src);
        audioRef.current = audio;
        audio.play();
        setIsPlaying(true);
        audio.onended = () => setIsPlaying(false);
      };

      return (
        <div className="text-slate-800 pb-1">
          <header className="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-rose-100 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => scrollTo('hero')}>
                <div className="w-10 h-10"><SmartImage src="logo/chillcreate_logo.png" alt="ロゴ" /></div>
                <div className="font-black text-rose-500 text-xl">ちるクリエイト</div>
              </div>
              <nav className="hidden md:flex gap-6 font-bold text-sm">
                {['NEWS', 'ABOUT', 'CHARACTERS', 'CONTACT'].map(item => (
                  <button key={item} onClick={() => scrollTo(item.toLowerCase())} className="hover:text-rose-400">{item}</button>
                ))}
              </nav>
            </div>
          </header>

          <section id="hero" className="min-h-screen flex flex-col items-center justify-center bg-rose-50 pt-16">
            <SmartImage src="main/all_characters.png" alt="集合" className="h-[70vh]" />
          </section>

          <section id="news" className="py-20 px-4 max-w-4xl mx-auto">
            <SectionTitle en="NEWS" ja="最新情報" />
            {newsList.map((n, i) => <div key={i} className="mb-4 p-4 border rounded-xl">{n.date} - {n.title}</div>)}
          </section>

          <section id="about" className="py-20 bg-rose-100 text-center">
            <SectionTitle en="ABOUT" ja="について" />
            <p>静岡を盛り上げる個人サークルです！</p>
          </section>

          <section id="characters" className="py-20 px-4 max-w-6xl mx-auto">
            <SectionTitle en="CHARACTERS" ja="キャラクター" />
            <div className="grid md:grid-cols-3 gap-8">
              {characters.map(char => (
                <div key={char.id} className="p-6 border rounded-3xl cursor-pointer" onClick={() => setSelectedChar(char)}>
                  <h3 className="text-2xl font-black">{char.name}</h3>
                  <p>{char.catch}</p>
                </div>
              ))}
            </div>
          </section>

          {selectedChar && (
            <div className="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4" onClick={() => setSelectedChar(null)}>
              <div className="bg-white p-8 rounded-3xl max-w-lg w-full" onClick={e => e.stopPropagation()}>
                <h2 className="text-3xl font-black">{selectedChar.name}</h2>
                <button onClick={() => playVoice(selectedChar.voiceSrc)} className="mt-4 bg-rose-400 text-white px-6 py-2 rounded-full">ボイス再生</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
