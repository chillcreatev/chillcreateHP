    body { font-family: 'M PLUS Rounded 1c', sans-serif; scroll-behavior: smooth; }
    
    /* 背景のふわふわアニメーション */
    .animate-blob { animation: blob 7s infinite; }
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    .animation-delay-2000 { animation-delay: 2s; }

    .hover-pop { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .hover-pop:hover { transform: translateY(-20px) scale(1.05); }

    .hover-tilt { transition: transform 0.3s ease-in-out; }
    .hover-tilt:hover { transform: rotate(10deg) scale(1.1); }

    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-fade {
      animation: slideFadeIn 0.5s ease-out forwards;
    }

    .text-pretty {
      text-wrap: pretty;
      word-break: auto-phrase;
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #fda4af; border-radius: 10px; }

    .animate-ping-slow {
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes ping {
      75%, 100% { transform: scale(1.5); opacity: 0; }
    }
  </style>

            <div className="max-w-4xl mx-auto">
              <SectionTitle en="LINKS" ja="公式リンク" />
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 text-center text-pretty">
                <a href="https://x.com/chillcreate_v" target="_blank" className="flex flex-col items-center justify-center p-6 rounded-2xl shadow-md transition-all duration-300 hover:-translate-y-2 bg-black text-white group text-center text-pretty">
                  <Icon name="twitter" className="w-10 h-10 mb-2 transform group-hover:scale-110 transition-transform" />
                  <span className="font-bold text-xs tracking-wider uppercase whitespace-nowrap text-center text-pretty">𝕏 (Twitter)</span>
                </a>
                <a href="https://www.instagram.com/chillcreate_v/?hl=ja" target="_blank" className="flex flex-col items-center justify-center p-6 rounded-2xl shadow-md transition-all duration-300 hover:-translate-y-2 bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-500 text-white group text-center text-pretty">
                  <Icon name="instagram" className="w-10 h-10 mb-2 transform group-hover:scale-110 transition-transform" />
                  <span className="font-bold text-xs tracking-wider uppercase whitespace-nowrap text-center text-pretty">Instagram</span>
                </a>
                <a href="https://youtube.com/@chillcreate_v?si=Fw_HSbG6yyzgUROY" target="_blank" className="flex flex-col items-center justify-center p-6 rounded-2xl shadow-md transition-all duration-300 hover:-translate-y-2 bg-red-600 text-white group text-center">
                  <Icon name="youtube" className="w-10 h-10 mb-2 transform group-hover:scale-110 transition-transform" />
                  <span className="font-bold text-xs tracking-wider uppercase whitespace-nowrap text-center text-pretty">YouTube</span>
                </a>
                <a href="https://chillcreate.booth.pm/" target="_blank" className="flex flex-col items-center justify-center p-6 rounded-2xl shadow-md transition-all duration-300 hover:-translate-y-2 bg-rose-500 text-white group text-center">
                  <Icon name="shopping-bag" className="w-10 h-10 mb-2 transform group-hover:scale-110 transition-transform" />
                  <span className="font-bold text-xs tracking-wider uppercase whitespace-nowrap text-center text-pretty">BOOTH</span>
                </a>
              </div>
            </div>
          </section>

          {/* 6. Guidelines Area */}
          <section id="guidelines" className="py-20 px-4 bg-white border-t border-rose-100 text-center text-pretty overflow-visible">
            <div className="max-w-6xl mx-auto relative flex flex-col items-center md:flex-row md:justify-center gap-14 text-pretty">
              
              <div className="hidden lg:flex flex-col gap-12 w-56 shrink-0 justify-center text-pretty">
                <div className="w-56 h-56 hover-tilt cursor-pointer"><SmartImage src="mini/mini_chill.png" alt="ちるミニ" className="w-full h-full" /></div>
                <div className="w-56 h-56 hover-tilt cursor-pointer"><SmartImage src="mini/mini_kohaku.png" alt="琥珀ミニ" className="w-full h-full" /></div>
              </div>

              <div className="max-w-3xl w-full text-center text-pretty">
                <SectionTitle en="GUIDELINES" ja="二次創作ガイドライン" />
                <div className="bg-slate-50 border border-rose-100 rounded-2xl p-8 space-y-4 text-sm text-slate-700 leading-relaxed font-bold text-left shadow-inner text-pretty">
                  <p>『ちるクリエイト』のキャラクターを愛していただきありがとうございます。皆様の二次创作活動を応援しております。</p>
                  <ul className="list-disc pl-5 space-y-2 text-pretty text-left">
                    <li>公序良俗に反する内容は禁止します。</li>
                    <li>公式の制作物であると誤解を招くような表現はご遠慮ください。</li>
                    <li className="text-red-500 text-base font-black text-left">当サークルの画像・イラストを使用したAIによる画像生成・学習は一切禁止いたします。</li>
                    <li>非営利目的の有償頒布については常識の範囲内で許可いたします.</li>
                    <li className="text-rose-500 font-black text-pretty text-left text-pretty">作品をSNS等に投稿する際は、ぜひハッシュタグ<span className="font-black px-2 py-0.5 bg-rose-100 rounded mx-1">#ちるクリエイトFA</span>をつけて投稿してください！楽しみにしています！</li>
                  </ul>
                </div>
              </div>

              <div className="hidden lg:flex flex-col gap-12 w-56 shrink-0 justify-center text-pretty">
                <div className="w-56 h-56 hover-tilt cursor-pointer"><SmartImage src="mini/mini_chacha.png" alt="茶々ミニ" className="w-full h-full" /></div>
                <div className="w-56 h-56 hover-tilt cursor-pointer"><SmartImage src="mini/mini_10.png" alt="10ミニ" className="w-full h-full" /></div>
              </div>

              <div className="lg:hidden flex flex-wrap justify-center gap-4 mt-8">
                {['mini/mini_chill.png', 'mini/mini_kohaku.png', 'mini/mini_chacha.png', 'mini/mini_10.png'].map((src, i) => (
                  <div key={i} className="w-24 h-24 hover-tilt cursor-pointer text-center text-pretty"><SmartImage src={src} alt="ミニキャラ" className="w-full h-full" /></div>
                ))}
              </div>
            </div>
          </section>

          {/* 7. Credits Area */}
          <section id="credits" className="py-20 px-4 bg-slate-800 text-rose-50 text-left text-pretty text-pretty">
            <div className="max-w-6xl mx-auto text-left text-pretty text-pretty">
              <SectionTitle en="CREDITS" ja="制作クレジット" />
              <div className="grid grid-cols-1 md:grid-cols-3 gap-12 text-left">
                <div>
                  <h3 className="text-xl font-black text-rose-300 mb-6 border-b border-slate-700 pb-2 uppercase text-left text-pretty">Character Design</h3>
                  <ul className="space-y-3 text-sm text-left text-pretty">
                    {characters.map(char => (
                      <li key={char.id} className="flex justify-between border-b border-slate-700 pb-1 text-left text-pretty">
                        <span>{char.name}</span><span className="font-bold text-white whitespace-nowrap ml-2 text-left">{char.illustrator}</span>
                      </li>
                    ))}
                  </ul>
                </div>
                <div>
                  <h3 className="text-xl font-black text-white mb-6 border-b border-slate-700 pb-2 uppercase text-left text-pretty">Special Illustration</h3>
                  <ul className="space-y-3 text-sm text-left text-pretty">
                    <li className="flex justify-between border-b border-slate-700 pb-1 text-left text-pretty"><span>ミニキャライラスト</span><span className="font-bold text-white ml-2 text-left">ねこぐさ艦長</span></li>
                    <li className="flex justify-between pb-1 border-b border-slate-700 text-left text-pretty"><span>ぬい風イラスト</span><span className="font-bold text-white ml-2 text-left">Noa</span></li>
                    <li className="flex justify-between pb-1 border-b border-slate-700 text-left text-pretty"><span>Topボタンミニイラスト</span><span className="font-bold text-white ml-2 text-left">ペペロンロン</span></li>
                  </ul>
                </div>
                <div>
                  <h3 className="text-xl font-black text-rose-300 mb-6 border-b border-slate-700 pb-2 uppercase text-left text-pretty">Other</h3>
                  <ul className="space-y-3 text-sm text-left text-pretty">
                    <li className="flex justify-between border-b border-slate-700 pb-1 text-left text-pretty"><span>サークルリーダー/企画/制作</span><span className="font-bold text-white ml-2 text-right">てれ子</span></li>
                    <li className="flex justify-between border-b border-slate-700 pb-1 text-left text-pretty"><span>ディレクション/制作</span><span className="font-bold text-white ml-2 text-right">八の字</span></li>
                    <li className="flex justify-between border-b border-slate-700 pb-1 text-left text-pretty"><span>音楽</span><span className="font-bold text-white ml-2 text-right">BARRELPIYA</span></li>
                    <li className="flex justify-between border-b border-slate-700 pb-1 text-left text-pretty"><span>シナリオライター</span><span className="font-bold text-white ml-2 text-right">diemonzi</span></li>
                    <li className="flex justify-between border-b border-slate-700 pb-1 text-left text-pretty"><span>ロゴ制作</span><span className="font-bold text-white ml-2 text-right">てれ子</span></li>
                    <li className="flex justify-between pb-1 border-b border-slate-700 text-left text-pretty"><span>ウェブ制作</span><span className="font-bold text-white ml-2 text-right">八の字</span></li>
                  </ul>
                </div>
              </div>
            </div>
          </section>

          {/* 8. Contact Area */}
          <section id="contact" className="py-24 px-4 bg-rose-400 text-white text-center relative overflow-hidden text-pretty text-pretty">

                  <button onClick={handleCopyEmail} className="flex items-center gap-2 bg-white text-rose-500 text-xs font-black py-2 px-4 rounded-full hover:bg-rose-50 transition-colors shrink-0 shadow-md uppercase whitespace-nowrap text-center text-pretty text-pretty">

            </div>
          </section>

          {/* 9. Footer */}
          <footer className="bg-rose-950 text-rose-300 py-10 text-center text-xs font-bold tracking-[0.3em] uppercase text-pretty text-pretty text-pretty">
            <p>&copy; 2026 ちるクリエイト All Rights Reserved.</p>
          </footer>

          {/* Modal with Voice Playback */}
          {selectedChar && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-2 sm:p-4 bg-black/90 backdrop-blur-sm animate-in fade-in duration-300 text-left text-pretty text-pretty text-pretty" onClick={() => setSelectedChar(null)}>
              <div className="relative w-full max-w-5xl max-h-[90vh] md:min-h-[600px] bg-white rounded-[32px] sm:rounded-[40px] overflow-hidden shadow-2xl flex flex-col md:flex-row animate-in zoom-in-95 duration-300 text-pretty text-pretty text-pretty text-pretty" onClick={e => e.stopPropagation()}>
                <button onClick={() => setSelectedChar(null)} className="absolute top-4 right-4 z-[100] p-3 bg-black/40 hover:bg-black/60 text-white rounded-full transition-colors backdrop-blur-md shadow-lg border border-white/20 text-pretty text-pretty text-pretty">
                   <Icon name="close" className="w-6 h-6 sm:w-8 sm:h-8 text-pretty text-pretty text-pretty" />
                </button>
                <div className="w-full flex flex-col md:flex-row overflow-y-auto custom-scroll text-left text-pretty text-pretty text-pretty text-pretty text-pretty">
                  <div className="w-full md:w-2/3 h-[45vh] md:h-auto min-h-[400px] bg-slate-100 flex items-center justify-center p-0 relative shrink-0 text-pretty text-pretty text-pretty text-pretty" style={{ backgroundColor: selectedChar.color + '10' }}>
                     <div className="absolute inset-0 opacity-10 pointer-events-none text-pretty text-pretty text-pretty" style={{ backgroundImage: 'radial-gradient(circle at 2px 2px, currentColor 1px, transparent 0)', backgroundSize: '32px 32px', color: selectedChar.color }}></div>
                     <div className="w-full h-full flex items-center justify-center overflow-hidden text-center text-pretty text-pretty text-pretty text-pretty">
                        <SmartImage 
                          src={selectedChar.mainImg} 
                          alt={`${selectedChar.name} 全身立ち絵`} 
                          className="max-w-full max-h-full h-full w-auto object-contain object-center drop-shadow-2xl text-pretty text-pretty text-pretty text-pretty text-pretty" 
                        />
                     </div>
                  </div>
                  <div className="w-full md:w-1/3 p-6 sm:p-8 md:p-10 flex flex-col justify-center bg-white relative text-left text-pretty text-pretty text-pretty text-pretty">
                    <span className="text-[10px] sm:text-[12px] font-black text-slate-400 mb-1 sm:mb-2 tracking-[0.3em] uppercase whitespace-nowrap text-left text-pretty text-pretty text-pretty text-pretty">{selectedChar.furigana}</span>
                    <h2 className="text-3xl sm:text-5xl font-black text-slate-800 mb-4 sm:mb-6 leading-tight text-left leading-none text-pretty text-pretty text-pretty text-pretty text-pretty">{selectedChar.name}</h2>
                    
                    <div className="w-12 sm:w-16 h-1.5 sm:h-2 rounded-full mb-6 sm:mb-8 text-left text-pretty text-pretty text-pretty text-pretty" style={{ backgroundColor: selectedChar.color }}></div>
                    <p className="text-base sm:text-xl font-bold text-slate-600 italic mb-8 sm:mb-10 leading-relaxed text-pretty text-left text-pretty text-pretty text-pretty text-pretty text-pretty">"{selectedChar.catch}"</p>
                    
                    <div className="grid grid-cols-1 gap-3 sm:gap-4 mb-8 text-left text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty">
                      {[
                        { label: 'Area / From', value: `${selectedChar.area} / ${selectedChar.from}` },
                        { label: 'Motif / Color', value: `${selectedChar.motif} / ${selectedChar.colorName}` },
                        { label: 'Illustration', value: selectedChar.illustrator }
                      ].map((item, idx) => (
                        <div key={idx} className="bg-slate-50 p-4 sm:p-5 rounded-xl sm:rounded-2xl border border-slate-100 text-left text-pretty text-pretty text-pretty text-pretty">
                          <p className="text-slate-400 mb-0.5 sm:mb-1 font-black text-[10px] uppercase tracking-widest text-left text-pretty text-pretty text-pretty text-pretty text-pretty">{item.label}</p>
                          <p className="font-bold text-slate-800 text-sm sm:text-lg text-left text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty">{item.value}</p>
                        </div>
                      ))}
                    </div>

                    <div className="flex justify-center mt-2 text-center text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty">
                      <button 
                        onClick={() => playVoice(selectedChar.voiceSrc)}
                        className="relative group flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 bg-rose-400 text-white rounded-full shadow-lg hover:bg-rose-500 hover:scale-110 transition-all duration-300 overflow-visible text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty"
                        title="ボイスを再生"
                      >
                        {isPlaying && (
                          <div className="absolute inset-0 rounded-full bg-rose-400 animate-ping-slow pointer-events-none text-pretty text-pretty text-pretty text-pretty"></div>
                        )}
                        <Icon name={isPlaying ? "volume" : "play"} className="w-8 h-8 sm:w-10 sm:h-10 text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty" />
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Back to Top Button */}
          {showTopBtn && (
            <button onClick={() => scrollTo('hero')} className="fixed bottom-6 right-6 sm:bottom-8 sm:right-8 z-50 w-20 h-20 sm:w-32 sm:h-32 drop-shadow-2xl animate-slide-fade flex items-center justify-center group text-center text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty">
              <div className="w-full h-full flex items-center justify-center relative transition-transform duration-300 hover:scale-110 text-pretty text-pretty text-pretty text-pretty">
                <SmartImage src="mini/mini1_chill.png" alt="Topへ" className="w-full h-full text-center text-pretty text-pretty text-pretty text-pretty text-pretty" />
                <div className="absolute inset-0 rounded-full bg-rose-400/0 group-hover:bg-rose-400/10 transition-colors pointer-events-none text-pretty text-pretty text-pretty text-pretty text-pretty"></div>
              </div>
              <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] sm:text-[12px] font-black px-2 sm:px-3 py-1 rounded-full shadow-lg border-2 border-white uppercase tracking-tighter text-center leading-none flex items-center justify-center min-w-[36px] sm:min-w-[40px] text-pretty text-pretty text-pretty text-pretty text-pretty text-pretty">Up</span>
            </button>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
